name: Daily F-liiga report

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Update match data
        run: fliiga-model collect
      - name: Import staged odds when present
        run: |
          if [ -f data/odds_input.csv ]; then
            fliiga-model odds-import --input data/odds_input.csv
          fi
      - name: Build value and CLV reports
        run: |
          fliiga-model value-report --min-ev 0.05
          fliiga-model clv-report
      - uses: actions/upload-artifact@v4
        with:
          name: fliiga-daily-report
          path: |
            data/fliiga_men_history.csv
            data/fliiga_men_fixtures.csv
            data/daily_value.csv
            data/clv_report.csv
            data/odds.db
          if-no-files-found: warn
          retention-days: 30
