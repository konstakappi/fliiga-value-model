[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fliiga-value-model"
version = "0.8.0"
description = "Transparent Poisson baseline for F-liiga 1X2 probabilities and value betting research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
fliiga-model = "fliiga_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
